name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  LOG_PRETTY: "true"

jobs:
  dependency-audit:
    name: Dependency Vulnerability Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      # Fails the build on any high/critical advisory in the committed lockfile.
      # Reads package-lock.json directly, so no install step is required.
      # Dependabot (see .github/dependabot.yml) opens patch PRs weekly to keep
      # dependencies ahead of this gate.
      - name: Audit dependencies (fail on high/critical)
        run: npm audit --audit-level=high

  docker-build:
    name: Docker Image Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Builds the image end-to-end so the digest-pinned base images (and any
      # Dockerfile change) are validated before merge — in particular this
      # exercises Dependabot's weekly digest bumps. The image is built but never
      # pushed or deployed.
      - name: Build Docker image
        run: docker build -t lebenshilfe:ci .

  lint-and-format:
    name: Lint, Format, and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Check Formatting
        run: npm run format:check

      - name: Run Linter
        run: npm run lint

      - name: Build Application
        run: npm run build
