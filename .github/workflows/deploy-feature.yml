name: Deploy Feature Branch

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decrypt Secrets
        uses: ./.github/actions/decrypt-secrets
        with:
          vault_password: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}

      - name: Set Safe Branch Name
        run: |
          BRANCH_NAME_SAFE=$(echo "${{ github.ref_name }}" | tr -cd 'a-zA-Z0-9-' | tr 'A-Z' 'a-z')
          echo "BRANCH_NAME_SAFE=$BRANCH_NAME_SAFE" >> $GITHUB_ENV

      - name: Build Docker image
        run: |
          docker build \
            -t registry.infra.codingforchange.com/lebenshilfe-${{ env.BRANCH_NAME_SAFE }}:latest \
            --build-arg NEXT_PUBLIC_GOOGLE_MAPS_API_KEY="$(jq -r '.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY // empty' decrypted.json)" \
            .

      - name: Login to registry
        run: |
          jq -r '.REGISTRY_PASSWORD // empty' decrypted.json | docker login registry.infra.codingforchange.com \
            -u "$(jq -r '.REGISTRY_USERNAME // empty' decrypted.json)" \
            --password-stdin

      - name: Push Docker image
        run: |
          docker push registry.infra.codingforchange.com/lebenshilfe-${{ env.BRANCH_NAME_SAFE }}:latest

      - name: Setup SSH
        uses: ./.github/actions/setup-ssh

      - name: Generate Configs and Environment
        run: |
          APP_PORT=$(echo "${{ env.BRANCH_NAME_SAFE }}" | cksum | awk '{print $1 % 1000 + 8000}')
          DB_PASSWORD="feature-secret-pass"

          echo "APP_PORT=$APP_PORT" > env_vars.txt
          echo "BRANCH_NAME_SAFE=${{ env.BRANCH_NAME_SAFE }}" >> env_vars.txt

          # Generate Caddyfile
          cat << EOF > Caddyfile
          ${{ env.BRANCH_NAME_SAFE }}.lebenshilfe.codingforchange.com {
              reverse_proxy localhost:${APP_PORT}
          }
          EOF

          # Generate .env
          echo "FEATURE_BRANCH=${{ github.ref_name }}" > .env
          echo "BRANCH_NAME_SAFE=${{ env.BRANCH_NAME_SAFE }}" >> .env
          echo "APP_PORT=${APP_PORT}" >> .env
          echo "DB_PASSWORD=${DB_PASSWORD}" >> .env
          echo "DATABASE_URL=mysql://root:${DB_PASSWORD}@db:3306/lebenshilfe" >> .env
          echo "BETTER_AUTH_SECRET=$(jq -r '.BETTER_AUTH_SECRET // empty' decrypted.json)" >> .env
          echo "BETTER_AUTH_URL=https://${{ env.BRANCH_NAME_SAFE }}.lebenshilfe.codingforchange.com" >> .env
          echo "NEXT_PUBLIC_APP_URL=https://${{ env.BRANCH_NAME_SAFE }}.lebenshilfe.codingforchange.com" >> .env
          echo "RESEND_API_KEY=$(jq -r '.RESEND_API_KEY // empty' decrypted.json)" >> .env
          echo "NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=$(jq -r '.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY // empty' decrypted.json)" >> .env
          echo "S3_ENDPOINT=$(jq -r '.S3_ENDPOINT // empty' decrypted.json)" >> .env
          echo "S3_REGION=$(jq -r '.S3_REGION // empty' decrypted.json)" >> .env
          echo "S3_ACCESS_KEY_ID=$(jq -r '.S3_ACCESS_KEY_ID // empty' decrypted.json)" >> .env
          echo "S3_SECRET_ACCESS_KEY=$(jq -r '.S3_SECRET_ACCESS_KEY // empty' decrypted.json)" >> .env
          echo "S3_BUCKET=$(jq -r '.S3_BUCKET // empty' decrypted.json)" >> .env
          echo "EMAIL_FROM=info@codingforchange.com" >> .env

      - name: Deploy to VPS
        run: |
          SSH="ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key"
          SCP="scp -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key"
          SSH_TARGET="deploy-lebenshilfe@codingforchange.com"
          BRANCH_NAME_SAFE=$(grep BRANCH_NAME_SAFE env_vars.txt | cut -d'=' -f2)
          TARGET_DIR="/var/www/lebenshilfe-feature-${BRANCH_NAME_SAFE}"

          $SSH $SSH_TARGET "mkdir -p ${TARGET_DIR}"

          $SCP docker-compose.feature.yml ${SSH_TARGET}:${TARGET_DIR}/docker-compose.yml
          $SCP Caddyfile ${SSH_TARGET}:${TARGET_DIR}/Caddyfile
          $SCP .env ${SSH_TARGET}:${TARGET_DIR}/.env

          $SSH $SSH_TARGET "cd ${TARGET_DIR} && \
            docker compose pull && \
            docker compose up -d && \
            sudo systemctl reload caddy"

      - name: Clean up Secrets
        if: always()
        run: |
          rm -f .vault_pass dump.yml decrypted.json .env Caddyfile env_vars.txt
