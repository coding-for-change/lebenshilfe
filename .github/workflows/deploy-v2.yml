name: Build and deploy (infra-v2)

# The new pipeline: build the image, push it to the registry of infra-v2, then call the
# reusable deploy workflow of infra-v2 (starts the inactive blue/green slot, waits for the
# health check, switches Caddy).
#
# MANUAL ONLY until the cutover. The live pipeline is still deploy.yml (old VPS, port 3000).
# Until DNS points at the new server a run of this workflow deploys to the rehearsal
# address (lebenshilfe-new.codingforchange.com), not to production.
#
# Cutover (in this order, see the migrate-app skill in infra-v2):
#   1. the rehearsal is done and the database is migrated
#   2. one PR that deletes deploy.yml (and the old secrets handling) and changes the trigger
#      below to `push: branches: [main]`
#   3. DNS switch
#
# Needs, before the first run:
#   - repo secrets NEXT_PUBLIC_GOOGLE_MAPS_API_KEY and NEXT_SERVER_ACTIONS_ENCRYPTION_KEY
#     (build arguments; the server-actions key must equal the one in infra-v2's vault)
#   - the org secrets REGISTRY_*, DEPLOY_SSH_KEY, ANSIBLE_VAULT_PASSWORD, DEPLOY_APP_ID,
#     DEPLOY_APP_PRIVATE_KEY: this repo is in `github_secret_repos` of infra-v2 and
#     playbook-setup-github.yml has run
#   - NO repo secret called ANSIBLE_VAULT_PASSWORD: a repo secret overrides the org secret
#     and would hand infra-v2 the wrong password. The old pipeline reads
#     LEGACY_ANSIBLE_VAULT_PASSWORD first (see deploy.yml), so create that one with the old
#     value, then delete the repo's ANSIBLE_VAULT_PASSWORD.
on:
  workflow_dispatch:

env:
  # The Docker registry of the infrastructure, the same for every project
  REGISTRY: docker-registry.codingforchange.com

# One run at a time, newer runs wait instead of cancelling a deploy that is under way
concurrency:
  group: deploy-production-v2
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build and push the image
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      # Tag = commit sha only. No `latest`: the nightly prune deletes by digest and would
      # take the running image's manifest with it. The image name must match what the
      # infra-v2 role pulls: localhost:5000/lebenshilfe
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/lebenshilfe:${{ github.sha }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
            NEXT_SERVER_ACTIONS_ENCRYPTION_KEY=${{ secrets.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY }}

  deploy:
    name: Deploy
    needs: build
    # Lives in infra-v2. This repo needs access to that private repo (set up by
    # playbook-setup-github.yml).
    uses: coding-for-change/infra-v2/.github/workflows/deploy-app.yml@main
    with:
      app: lebenshilfe
      image_tag: ${{ github.sha }}
    secrets:
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
      DEPLOY_APP_ID: ${{ secrets.DEPLOY_APP_ID }}
      DEPLOY_APP_PRIVATE_KEY: ${{ secrets.DEPLOY_APP_PRIVATE_KEY }}
