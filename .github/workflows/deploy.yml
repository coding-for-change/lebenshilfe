name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decrypt Secrets
        run: |
          if ! command -v ansible-vault &> /dev/null; then
            pipx install ansible-core
          fi
          echo "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > .vault_pass
          ansible-vault decrypt .config/secrets.yml --vault-password-file .vault_pass

          # Register secrets with GitHub Actions to dynamically mask them in the logs
          echo "::add-mask::$(yq '.REGISTRY_USERNAME' .config/secrets.yml)"
          echo "::add-mask::$(yq '.REGISTRY_PASSWORD' .config/secrets.yml)"
          echo "::add-mask::$(yq '.DATABASE_URL' .config/secrets.yml)"
          echo "::add-mask::$(yq '.BETTER_AUTH_SECRET' .config/secrets.yml)"
          echo "::add-mask::$(yq '.RESEND_API_KEY' .config/secrets.yml)"
          echo "::add-mask::$(yq '.S3_ACCESS_KEY_ID' .config/secrets.yml)"
          echo "::add-mask::$(yq '.S3_SECRET_ACCESS_KEY' .config/secrets.yml)"

      # 2. Build Docker image
      - name: Build Docker image
        run: |
          docker build \
            -t registry.infra.codingforchange.com/lebenshilfe:${{ github.sha }} \
            -t registry.infra.codingforchange.com/lebenshilfe:latest \
            .

      # 3. Push to private registry
      - name: Login to registry
        run: |
          yq '.REGISTRY_PASSWORD' .config/secrets.yml | docker login registry.infra.codingforchange.com \
            -u "$(yq '.REGISTRY_USERNAME' .config/secrets.yml)" \
            --password-stdin

      - name: Push Docker image
        run: |
          docker push registry.infra.codingforchange.com/lebenshilfe:${{ github.sha }}
          docker push registry.infra.codingforchange.com/lebenshilfe:latest

      # 4. Deploy to VPS via SSH
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          yq '.VPS_DEPLOY_KEY' .config/secrets.yml > ~/.ssh/deploy_key
          # Add a trailing newline to the key in case yq omits it
          echo "" >> ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H codingforchange.com >> ~/.ssh/known_hosts

      - name: Copy files to VPS
        run: |
          SSH="ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key"
          SCP="scp -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key"
          SSH_TARGET="deploy-lebenshilfe@codingforchange.com"

          # Ensure target directory exists
          $SSH $SSH_TARGET "mkdir -p /var/www/lebenshilfe"

          # Copy docker-compose (prod → docker-compose.yml on VPS)
          $SCP docker-compose.prod.yml ${SSH_TARGET}:/var/www/lebenshilfe/docker-compose.yml

          # Copy Caddyfile
          $SCP Caddyfile ${SSH_TARGET}:/var/www/lebenshilfe/Caddyfile

          # Write .env from decrypted secrets and copy to VPS
          printf '%s\n' \
            "DATABASE_URL=$(yq '.DATABASE_URL' .config/secrets.yml)" \
            "BETTER_AUTH_SECRET=$(yq '.BETTER_AUTH_SECRET' .config/secrets.yml)" \
            "RESEND_API_KEY=$(yq '.RESEND_API_KEY' .config/secrets.yml)" \
            "S3_ENDPOINT=$(yq '.S3_ENDPOINT' .config/secrets.yml)" \
            "S3_REGION=$(yq '.S3_REGION' .config/secrets.yml)" \
            "S3_ACCESS_KEY_ID=$(yq '.S3_ACCESS_KEY_ID' .config/secrets.yml)" \
            "S3_SECRET_ACCESS_KEY=$(yq '.S3_SECRET_ACCESS_KEY' .config/secrets.yml)" \
            "S3_BUCKET=$(yq '.S3_BUCKET' .config/secrets.yml)" \
            "BETTER_AUTH_URL=https://lebenshilfe.codingforchange.com" \
            "NEXT_PUBLIC_APP_URL=https://lebenshilfe.codingforchange.com" \
            "EMAIL_FROM=info@codingforchange.de" \
            > /tmp/.env
          $SCP /tmp/.env ${SSH_TARGET}:/var/www/lebenshilfe/.env
          rm -f /tmp/.env

      - name: Deploy on VPS
        run: |
          SSH="ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key deploy-lebenshilfe@codingforchange.com"

          $SSH "cd /var/www/lebenshilfe && \
            docker compose pull && \
            docker compose up -d"
