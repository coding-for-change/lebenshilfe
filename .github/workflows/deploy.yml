name: Deploy

# Build the image, push it to the registry of infra-v2, then start the deploy in infra-v2
# (starts the inactive blue/green slot, waits for the health check, switches Caddy). The server side (compose file, secrets, Caddy) lives in infra-v2,
# role `lebenshilfe`.
#
# Until DNS points at the new server, a deploy lands on the rehearsal address
# lebenshilfe-new.codingforchange.com. The old VPS (lebenshilfe.codingforchange.com)
# gets no new versions any more.
#
# Secrets:
#   - repo secrets NEXT_PUBLIC_GOOGLE_MAPS_API_KEY and NEXT_SERVER_ACTIONS_ENCRYPTION_KEY
#     (build arguments; the server-actions key must equal the one in infra-v2's vault)
#   - org secrets REGISTRY_*, DEPLOY_APP_ID, DEPLOY_APP_PRIVATE_KEY (this repo is in
#     `github_secret_repos` of infra-v2)
#
# This repo is public and may not call a workflow of the private infra-v2, so the deploy
# job starts infra-v2's deploy-dispatch.yml through the API and waits for it. The deploy
# logs stay in infra-v2.
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # The Docker registry of the infrastructure, the same for every project
  REGISTRY: docker-registry.codingforchange.com

# One run at a time, newer pushes wait instead of cancelling a deploy that is under way
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build and push the image
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      # Tag = commit sha only. No `latest`: the nightly prune deletes by digest and would
      # take the running image's manifest with it. The image name must match what the
      # infra-v2 role pulls: localhost:5000/lebenshilfe
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/lebenshilfe:${{ github.sha }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
            NEXT_SERVER_ACTIONS_ENCRYPTION_KEY=${{ secrets.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY }}

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The deploy runs in the private repo infra-v2 (workflow deploy-dispatch.yml): this job
    # starts it with a token of the GitHub App "c4c-infra-deploy" and waits for the result.
    # Its logs stay in infra-v2; this repo needs only DEPLOY_APP_ID and DEPLOY_APP_PRIVATE_KEY.
    steps:
      - name: Get a token for infra-v2
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.DEPLOY_APP_ID }}
          private-key: ${{ secrets.DEPLOY_APP_PRIVATE_KEY }}
          owner: coding-for-change
          repositories: infra-v2
          permission-actions: write

      - name: Start the deploy in infra-v2 and wait for it
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP: lebenshilfe
          IMAGE_TAG: ${{ github.sha }}
          CALLER: ${{ github.repository }}#${{ github.run_id }}-${{ github.run_attempt }}
          INFRA_REPO: coding-for-change/infra-v2
        run: |
          gh workflow run deploy-dispatch.yml --repo "$INFRA_REPO" --ref main \
            -f app="$APP" -f image_tag="$IMAGE_TAG" -f caller="$CALLER"

          # The run name ends with "(<caller>)": find our run
          RUN_ID=""
          for _ in $(seq 1 30); do
            RUN_ID=$(gh run list --repo "$INFRA_REPO" --workflow deploy-dispatch.yml \
                --event workflow_dispatch --limit 30 --json databaseId,displayTitle \
              | jq -r --arg c "($CALLER)" '[.[] | select(.displayTitle | endswith($c))][0].databaseId // empty')
            [ -n "$RUN_ID" ] && break
            sleep 5
          done
          [ -n "$RUN_ID" ] || { echo "::error::deploy run in infra-v2 not found"; exit 1; }
          echo "Deploy run in infra-v2 (private): https://github.com/$INFRA_REPO/actions/runs/$RUN_ID" | tee -a "$GITHUB_STEP_SUMMARY"

          while :; do
            STATE=$(gh run view "$RUN_ID" --repo "$INFRA_REPO" --json status,conclusion --jq '.status + " " + .conclusion')
            [ "${STATE%% *}" = completed ] && break
            sleep 15
          done
          echo "Result: ${STATE#* }" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "${STATE#* }" = success ]
