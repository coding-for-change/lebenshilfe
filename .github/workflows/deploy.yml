name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

# Serialize deploys. Without this, two merges in quick succession spawn two
# concurrent deploy runs; whichever finishes its `docker compose up` LAST wins,
# so a slower-building older commit can clobber a newer one (this happened with
# PRs #142/#143). The group forces runs to queue instead of racing, and
# cancel-in-progress:false keeps the running deploy alive while collapsing the
# queue to the newest pending run — which, on linear main history, contains all
# prior commits. Net effect: prod always converges on the latest commit.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Decrypt Secrets
        run: |
          if ! command -v ansible-playbook &> /dev/null; then
            pipx install ansible-core
          fi
          echo "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > .vault_pass

          # Since the file uses inline !vault tags rather than full-file encryption, we use a simple playbook to parse it.
          cat << 'EOF' > dump.yml
          - hosts: localhost
            gather_facts: false
            vars_files:
              - .config/secrets.yml
            tasks:
              - copy:
                  content: "{{ vars | to_nice_json }}"
                  dest: decrypted.json
          EOF
          ansible-playbook dump.yml --vault-password-file .vault_pass

          # Register secrets with GitHub Actions to dynamically mask them in the logs
          echo "::add-mask::$(jq -r '.REGISTRY_USERNAME // empty' decrypted.json)"
          echo "::add-mask::$(jq -r '.REGISTRY_PASSWORD // empty' decrypted.json)"
          echo "::add-mask::$(jq -r '.DATABASE_URL // empty' decrypted.json)"
          echo "::add-mask::$(jq -r '.BETTER_AUTH_SECRET // empty' decrypted.json)"
          echo "::add-mask::$(jq -r '.RESEND_API_KEY // empty' decrypted.json)"
          echo "::add-mask::$(jq -r '.S3_ACCESS_KEY_ID // empty' decrypted.json)"
          echo "::add-mask::$(jq -r '.S3_SECRET_ACCESS_KEY // empty' decrypted.json)"
          echo "::add-mask::$(jq -r '.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY // empty' decrypted.json)"
          echo "::add-mask::$(jq -r '.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY // empty' decrypted.json)"
      # 2. Build Docker image
      - name: Build Docker image
        run: |
          docker build \
            -t registry.infra.codingforchange.com/lebenshilfe:${{ github.sha }} \
            -t registry.infra.codingforchange.com/lebenshilfe:latest \
            --build-arg NEXT_PUBLIC_GOOGLE_MAPS_API_KEY="$(jq -r '.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY // empty' decrypted.json)" \
            --build-arg NEXT_SERVER_ACTIONS_ENCRYPTION_KEY="$(jq -r '.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY // empty' decrypted.json)" \
            .

      # 3. Push to private registry
      - name: Login to registry
        run: |
          jq -r '.REGISTRY_PASSWORD // empty' decrypted.json | docker login registry.infra.codingforchange.com \
            -u "$(jq -r '.REGISTRY_USERNAME // empty' decrypted.json)" \
            --password-stdin

      - name: Push Docker image
        run: |
          docker push registry.infra.codingforchange.com/lebenshilfe:${{ github.sha }}
          docker push registry.infra.codingforchange.com/lebenshilfe:latest

      # 4. Release: record the new image tag in the infra repo. The infra pipeline
      # ignores ansible/releases/**, so this commit does not trigger a provisioning run.
      - name: Checkout infra repo
        uses: actions/checkout@v7
        with:
          repository: coding-for-change/coding-for-change-infra
          ref: main
          token: ${{ secrets.INFRA_REPO_TOKEN }}
          path: infra

      - name: Record the release in the infra repo
        working-directory: infra
        run: |
          printf '%s\n' \
            "# Written by the lebenshilfe pipeline (.github/workflows/deploy.yml) on every release." \
            "# Do not edit by hand unless you are rolling forward/back deliberately." \
            "lebenshilfe_image_tag: \"${GITHUB_SHA}\"" \
            > ansible/releases/lebenshilfe.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ansible/releases/lebenshilfe.yml
          if git diff --cached --quiet; then
            echo "Release ${GITHUB_SHA} already recorded"
            exit 0
          fi
          git commit -m "lebenshilfe: release ${GITHUB_SHA::7}" \
            -m "https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 3
          done
          echo "::error::Could not push the release commit to the infra repo"
          exit 1

      # 5. Deploy: blue/green via the infra repo's playbook, as the deploy-lebenshilfe user
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          jq -r '.VPS_DEPLOY_KEY // empty' decrypted.json > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Install Ansible
        run: |
          pipx install ansible-core
          ansible-galaxy collection install community.docker

      - name: Deploy with Ansible
        working-directory: infra/ansible
        run: |
          cp "$GITHUB_WORKSPACE/.vault_pass" .vault_pass
          ansible-playbook playbooks/lebenshilfe-deploy.yml \
            -e ansible_user=deploy-lebenshilfe \
            -e ansible_ssh_private_key_file="$HOME/.ssh/deploy_key"

      - name: Clean up Secrets
        if: always()
        run: |
          rm -f .vault_pass dump.yml decrypted.json infra/ansible/.vault_pass ~/.ssh/deploy_key
