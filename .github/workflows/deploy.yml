name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decrypt Secrets
        uses: ./.github/actions/decrypt-secrets
        with:
          vault_password: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
      # 2. Build Docker image
      - name: Build Docker image
        run: |
          docker build \
            -t registry.infra.codingforchange.com/lebenshilfe:${{ github.sha }} \
            -t registry.infra.codingforchange.com/lebenshilfe:latest \
            --build-arg NEXT_PUBLIC_GOOGLE_MAPS_API_KEY="$(jq -r '.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY // empty' decrypted.json)" \
            .

      # 3. Push to private registry
      - name: Login to registry
        run: |
          jq -r '.REGISTRY_PASSWORD // empty' decrypted.json | docker login registry.infra.codingforchange.com \
            -u "$(jq -r '.REGISTRY_USERNAME // empty' decrypted.json)" \
            --password-stdin

      - name: Push Docker image
        run: |
          docker push registry.infra.codingforchange.com/lebenshilfe:${{ github.sha }}
          docker push registry.infra.codingforchange.com/lebenshilfe:latest

      # 4. Deploy to VPS via SSH
      - name: Setup SSH
        uses: ./.github/actions/setup-ssh

      - name: Copy files to VPS
        run: |
          SSH="ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key"
          SCP="scp -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key"
          SSH_TARGET="deploy-lebenshilfe@codingforchange.com"

          # Ensure target directory exists
          $SSH $SSH_TARGET "mkdir -p /var/www/lebenshilfe"

          # Copy docker-compose (prod → docker-compose.yml on VPS)
          $SCP docker-compose.prod.yml ${SSH_TARGET}:/var/www/lebenshilfe/docker-compose.yml

          # Copy Caddyfile
          $SCP Caddyfile ${SSH_TARGET}:/var/www/lebenshilfe/Caddyfile

          # Write .env from decrypted secrets and copy to VPS
          printf '%s\n' \
            "DATABASE_URL=$(jq -r '.DATABASE_URL // empty' decrypted.json)" \
            "BETTER_AUTH_SECRET=$(jq -r '.BETTER_AUTH_SECRET // empty' decrypted.json)" \
            "RESEND_API_KEY=$(jq -r '.RESEND_API_KEY // empty' decrypted.json)" \
            "S3_ENDPOINT=$(jq -r '.S3_ENDPOINT // empty' decrypted.json)" \
            "S3_REGION=$(jq -r '.S3_REGION // empty' decrypted.json)" \
            "S3_ACCESS_KEY_ID=$(jq -r '.S3_ACCESS_KEY_ID // empty' decrypted.json)" \
            "S3_SECRET_ACCESS_KEY=$(jq -r '.S3_SECRET_ACCESS_KEY // empty' decrypted.json)" \
            "S3_BUCKET=$(jq -r '.S3_BUCKET // empty' decrypted.json)" \
            "NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=$(jq -r '.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY // empty' decrypted.json)" \
            "BETTER_AUTH_URL=https://lebenshilfe.codingforchange.com" \
            "NEXT_PUBLIC_APP_URL=https://lebenshilfe.codingforchange.com" \
            "EMAIL_FROM=info@codingforchange.com" \
            > /tmp/.env
          $SCP /tmp/.env ${SSH_TARGET}:/var/www/lebenshilfe/.env
          rm -f /tmp/.env

      - name: Deploy on VPS
        run: |
          SSH="ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key deploy-lebenshilfe@codingforchange.com"

          $SSH "cd /var/www/lebenshilfe && \
            docker compose pull && \
            docker compose up -d"

      - name: Clean up Secrets
        if: always()
        run: |
          rm -f .vault_pass dump.yml decrypted.json
