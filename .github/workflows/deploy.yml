name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

# Serialize deploys. Without this, two merges in quick succession spawn two
# concurrent deploy runs; whichever finishes its `docker compose up` LAST wins,
# so a slower-building older commit can clobber a newer one (this happened with
# PRs #142/#143). The group forces runs to queue instead of racing, and
# cancel-in-progress:false keeps the running deploy alive while collapsing the
# queue to the newest pending run — which, on linear main history, contains all
# prior commits. Net effect: prod always converges on the latest commit.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Decrypt Secrets
        run: |
          if ! command -v ansible-playbook &> /dev/null; then
            pipx install ansible-core
          fi
          echo "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > .vault_pass

          # Since the file uses inline !vault tags rather than full-file encryption, we use a simple playbook to parse it.
          cat << 'EOF' > dump.yml
          - hosts: localhost
            gather_facts: false
            vars_files:
              - .config/secrets.yml
            tasks:
              - copy:
                  content: "{{ vars | to_nice_json }}"
                  dest: decrypted.json
          EOF
          ansible-playbook dump.yml --vault-password-file .vault_pass

          # Register secrets with GitHub Actions to dynamically mask them in the logs
          echo "::add-mask::$(jq -r '.REGISTRY_USERNAME // empty' decrypted.json)"
          echo "::add-mask::$(jq -r '.REGISTRY_PASSWORD // empty' decrypted.json)"
          echo "::add-mask::$(jq -r '.DATABASE_URL // empty' decrypted.json)"
          echo "::add-mask::$(jq -r '.BETTER_AUTH_SECRET // empty' decrypted.json)"
          echo "::add-mask::$(jq -r '.RESEND_API_KEY // empty' decrypted.json)"
          echo "::add-mask::$(jq -r '.S3_ACCESS_KEY_ID // empty' decrypted.json)"
          echo "::add-mask::$(jq -r '.S3_SECRET_ACCESS_KEY // empty' decrypted.json)"
          echo "::add-mask::$(jq -r '.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY // empty' decrypted.json)"
      # 2. Build Docker image
      - name: Build Docker image
        run: |
          docker build \
            -t registry.infra.codingforchange.com/lebenshilfe:${{ github.sha }} \
            -t registry.infra.codingforchange.com/lebenshilfe:latest \
            --build-arg NEXT_PUBLIC_GOOGLE_MAPS_API_KEY="$(jq -r '.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY // empty' decrypted.json)" \
            .

      # 3. Push to private registry
      - name: Login to registry
        run: |
          jq -r '.REGISTRY_PASSWORD // empty' decrypted.json | docker login registry.infra.codingforchange.com \
            -u "$(jq -r '.REGISTRY_USERNAME // empty' decrypted.json)" \
            --password-stdin

      - name: Push Docker image
        run: |
          docker push registry.infra.codingforchange.com/lebenshilfe:${{ github.sha }}
          docker push registry.infra.codingforchange.com/lebenshilfe:latest

      # 4. Deploy to VPS via SSH
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          jq -r '.VPS_DEPLOY_KEY // empty' decrypted.json > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H codingforchange.com >> ~/.ssh/known_hosts

      - name: Copy files to VPS
        run: |
          SSH="ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key"
          SCP="scp -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key"
          SSH_TARGET="deploy-lebenshilfe@codingforchange.com"

          # Ensure target directory exists
          $SSH $SSH_TARGET "mkdir -p /var/www/lebenshilfe"

          # Copy docker-compose (prod → docker-compose.yml on VPS)
          $SCP docker-compose.prod.yml ${SSH_TARGET}:/var/www/lebenshilfe/docker-compose.yml

          # Copy Caddyfile
          $SCP Caddyfile ${SSH_TARGET}:/var/www/lebenshilfe/Caddyfile

          # Write .env from decrypted secrets and copy to VPS
          printf '%s\n' \
            "IMAGE_TAG=${{ github.sha }}" \
            "DATABASE_URL=$(jq -r '.DATABASE_URL // empty' decrypted.json)" \
            "BETTER_AUTH_SECRET=$(jq -r '.BETTER_AUTH_SECRET // empty' decrypted.json)" \
            "RESEND_API_KEY=$(jq -r '.RESEND_API_KEY // empty' decrypted.json)" \
            "S3_ENDPOINT=$(jq -r '.S3_ENDPOINT // empty' decrypted.json)" \
            "S3_REGION=$(jq -r '.S3_REGION // empty' decrypted.json)" \
            "S3_ACCESS_KEY_ID=$(jq -r '.S3_ACCESS_KEY_ID // empty' decrypted.json)" \
            "S3_SECRET_ACCESS_KEY=$(jq -r '.S3_SECRET_ACCESS_KEY // empty' decrypted.json)" \
            "S3_BUCKET=$(jq -r '.S3_BUCKET // empty' decrypted.json)" \
            "NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=$(jq -r '.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY // empty' decrypted.json)" \
            "BETTER_AUTH_URL=https://lebenshilfe.codingforchange.com" \
            "NEXT_PUBLIC_APP_URL=https://lebenshilfe.codingforchange.com" \
            "EMAIL_FROM=info@codingforchange.com" \
            > /tmp/.env
          $SCP /tmp/.env ${SSH_TARGET}:/var/www/lebenshilfe/.env
          rm -f /tmp/.env

      - name: Deploy on VPS
        run: |
          SSH="ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key deploy-lebenshilfe@codingforchange.com"

          $SSH "cd /var/www/lebenshilfe && \
            docker compose pull && \
            docker compose up -d"

      - name: Clean up Secrets
        if: always()
        run: |
          rm -f .vault_pass dump.yml decrypted.json
