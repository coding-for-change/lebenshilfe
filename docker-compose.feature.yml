services:
  app:
    image: localhost:5000/lebenshilfe:${FEATURE_BRANCH}
    restart: unless-stopped
    depends_on:
      - db
    env_file:
      - .env
    ports:
      - "${APP_PORT}:3000"
    command: >
      sh -c "npx prisma migrate deploy &&
             npx -y tsx scripts/seed-admin.ts &&
             node server.js"

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_DATABASE: lebenshilfe
    volumes:
      - db_data:/var/lib/mysql

  mailpit:
    image: axllent/mailpit
    restart: unless-stopped
    ports:
      - "${MAIL_PORT}:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_MAX_MESSAGES: 500

volumes:
  db_data:
