services:
  app:
    image: localhost:5000/lebenshilfe-${BRANCH_NAME_SAFE}:latest
    labels:
      alloy-logging: true
    restart: unless-stopped
    depends_on:
      - db
    env_file:
      - .env
    environment:
      - LOG_PRETTY=false
    ports:
      - "${APP_PORT}:3000"
    command: >
      sh -c "npx prisma migrate deploy &&
             npx -y tsx scripts/seed-admin.ts &&
             node server.js"

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_DATABASE: lebenshilfe
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
