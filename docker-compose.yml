services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: lebenshilfe
      POSTGRES_PASSWORD: lebenshilfe
      POSTGRES_DB: lebenshilfe_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
